name: Feature request / درخواست قابلیت
description: Suggest an addition to the API or the data.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / چه کاری می‌خواهید انجام دهید؟
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help? / چه چیزی کمک می‌کند؟
      render: ts
