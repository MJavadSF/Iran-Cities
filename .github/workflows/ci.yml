name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coverage
        if: matrix.node == 24
        run: npm run test:coverage
      - run: npm run build
      - run: npm run test:dist
      - run: npm run lint:package
      - run: npm run size
      - name: Pack
        if: matrix.node == 24
        run: npm pack --pack-destination artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.node == 24
        with:
          name: package
          path: artifact/*.tgz
          retention-days: 7

  runtime:
    name: Runtime (Node.js ${{ matrix.node }}, React ${{ matrix.react }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 14, react: 17 }
          - { node: 16, react: 18 }
          - { node: 18, react: 18 }
          - { node: 20, react: 19 }
          - { node: 22, react: 19 }
          - { node: 24, react: 19 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: artifact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Install the packed package in a clean project
        run: |
          mkdir consumer
          cp scripts/smoke-test.mjs consumer/
          cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../artifact/*.tgz react@${{ matrix.react }}
      - name: Smoke test
        working-directory: consumer
        run: node smoke-test.mjs

  other-runtimes:
    name: Runtime (${{ matrix.runtime }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: artifact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: matrix.runtime == 'bun'
      - name: Install the packed package in a clean project
        run: |
          mkdir consumer
          cp scripts/smoke-test.mjs consumer/
          cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../artifact/*.tgz react@19 zod valibot
      - name: Smoke test
        working-directory: consumer
        run: |
          if [ "${{ matrix.runtime }}" = "deno" ]; then deno run -A smoke-test.mjs; else bun smoke-test.mjs; fi

  types:
    name: Types (TypeScript ${{ matrix.typescript }}, ${{ matrix.project }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typescript: '3.9', project: tsconfig.json }
          - { typescript: '4.5', project: tsconfig.json }
          - { typescript: '4.9', project: tsconfig.json }
          - { typescript: '4.9', project: tsconfig.node16.json }
          - { typescript: '5.0', project: tsconfig.bundler.json }
          - { typescript: '5.9', project: tsconfig.json }
          - { typescript: '5.9', project: tsconfig.bundler.json }
          - { typescript: '5.9', project: tsconfig.node16.json }
          - { typescript: '7', project: tsconfig.bundler.json }
          - { typescript: '7', project: tsconfig.node16.json }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: artifact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Type-check a consumer
        working-directory: test/compat
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../../artifact/*.tgz typescript@${{ matrix.typescript }}
          npx tsc -p ${{ matrix.project }}

  nextjs:
    name: Next.js ${{ matrix.next }} (${{ matrix.bundler }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { next: 14, react: 18, bundler: webpack, build: 'next build' }
          - { next: 15, react: 19, bundler: webpack, build: 'next build' }
          - { next: latest, react: 19, bundler: turbopack, build: 'next build' }
          - { next: latest, react: 19, bundler: webpack, build: 'next build --webpack' }
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: artifact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install
        working-directory: test/fixtures/next-app
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../../../artifact/*.tgz next@${{ matrix.next }} react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }} @types/node typescript@5 zod
      - name: Build
        working-directory: test/fixtures/next-app
        run: npx ${{ matrix.build }}
      - name: Start and check the rendered page
        working-directory: test/fixtures/next-app
        run: |
          npx next start -p 3000 &
          node check.mjs http://localhost:3000
